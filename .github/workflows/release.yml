name: Release VSIX

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify tag matches package version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v${VERSION}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build VSIX package
        run: npm run package

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VSIX_PATH="cursor-usage-tracker-${VERSION}.vsix"

          if [ ! -f "${VSIX_PATH}" ]; then
            echo "Expected VSIX package not found: ${VSIX_PATH}"
            ls -la
            exit 1
          fi

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${VSIX_PATH}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${VSIX_PATH}" --title "${GITHUB_REF_NAME}" --generate-notes
          fi
